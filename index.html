:root{
  --ink:#e9ecf8; --soft:#aeb6d6; --line:rgba(255,255,255,.10);
  --glass:rgba(15,21,44,.84); --accent:#b9a6ff; --accent2:#8fd3c8; --warm:#ffd08a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#0b1020;color:var(--ink);overflow:hidden;
  font:16px/1.5 Rubik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
header{position:fixed;top:0;left:0;right:0;height:56px;z-index:3;display:flex;align-items:center;
  justify-content:space-between;padding:env(safe-area-inset-top) 12px 0}
header span{letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--soft)}
.ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(15,21,44,.45);
  color:var(--ink);font-size:18px;cursor:pointer}
.ic.off{opacity:.45;text-decoration:line-through}
main{position:fixed;inset:56px 0 0 0;z-index:2;overflow-y:auto;display:flex;justify-content:center;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
#view{width:100%;max-width:460px;animation:in .7s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:28px;font-weight:600;margin:14px 0 4px;text-wrap:balance;text-shadow:0 2px 18px #0b1020}
h2{font-size:21px;font-weight:600;margin:0 0 8px;text-wrap:balance}
p{margin:0 0 12px;color:var(--soft)}
.sub{text-shadow:0 1px 12px #0b1020}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:12px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.note{border-inline-start:2px solid var(--accent2);padding:2px 0;padding-inline-start:12px;font-size:14.5px;color:#cfd6ee}
button{font:inherit}
.btn{display:block;width:100%;min-height:52px;border-radius:16px;border:1px solid var(--line);
  background:rgba(255,255,255,.07);color:var(--ink);padding:12px 16px;margin:10px 0 0;cursor:pointer;
  font-weight:600;transition:transform .15s,background .3s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,#8f7df0,#6fb7c9);border:0;color:#0b1020}
.btn.quiet{background:none;border:0;color:var(--soft);font-weight:500;min-height:44px}
.opt{text-align:start;font-weight:500}
.opt.ico{display:flex;align-items:center;gap:14px}
.opt.ico svg{flex:none;width:28px;height:28px;fill:none;stroke:var(--accent2);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.opt small{display:block;color:var(--soft);font-weight:400;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{min-height:44px;padding:8px 14px;border-radius:22px;border:1px solid var(--line);
  background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer;transition:background .3s}
.chip.on{background:rgba(185,166,255,.3);border-color:var(--accent)}
label{display:flex;justify-content:space-between;color:var(--ink);margin-top:6px}
output{font-variant-numeric:tabular-nums;color:var(--warm);font-weight:600}
input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--accent);background:none}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);margin:-6px 0 12px}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:10px 0;font-size:14.5px}
.bar i{grid-column:1/3;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.bar b{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.bar span:nth-child(2){color:var(--soft);font-variant-numeric:tabular-nums}
.stat{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.stat strong{color:var(--warm);font-variant-numeric:tabular-nums;white-space:nowrap}
.thought{display:block;width:100%;text-align:start;background:none;border:0;padding:2px 0 14px;cursor:pointer;
  color:#d5dbf2;font-size:16px;line-height:1.45;text-shadow:0 1px 12px #0b1020;min-height:44px}
.thought small{display:block;color:var(--accent2);font-size:13.5px;margin-top:3px}
.cheer{color:var(--accent2)}
.inp{display:block;width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,.07);color:var(--ink);padding:10px 14px;font:inherit;margin:4px 0 12px;
  -webkit-user-select:text;user-select:text;color-scheme:dark}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
.fl{display:block;margin-top:4px}
.step{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.opt.on{background:rgba(185,166,255,.26);border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timer{display:block;width:100%;text-align:start;color:var(--ink);cursor:pointer;padding:14px 18px;margin:0 0 4px}
.timer small{color:var(--soft);letter-spacing:.12em;text-transform:uppercase;font-size:11.5px}
.timer b,.big{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--warm)}
.timer span{color:var(--accent2);font-size:14.5px}
.big{font-size:30px;margin-bottom:6px}
.save{color:var(--accent2);font-weight:600}
.ms{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.ms i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);font-style:normal;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#0b1020}
.ms.done i{background:var(--accent2);border-color:var(--accent2)}
.ms strong{color:var(--ink)}
.ms small{color:var(--warm);margin-inline-start:6px}
.ms p{margin:2px 0 0;font-size:14.5px}
.ms:not(.done) p{opacity:.7}
main.playing{pointer-events:none;overflow:hidden}
main.playing button{pointer-events:auto}
.stage{height:100%;display:flex;flex-direction:column;justify-content:space-between}
#gprompt{font-size:18px;color:var(--ink);text-align:center;text-wrap:balance;min-height:3em;
  text-shadow:0 2px 14px #0b1020;margin-top:8px}
#gui{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.stage .btn{max-width:220px;margin:0 auto}
.modal{position:fixed;inset:0;z-index:5;background:rgba(6,9,20,.78);display:flex;align-items:center;
  justify-content:center;padding:16px;overflow-y:auto}
.modal[hidden]{display:none}
.modal .card{max-width:460px;max-height:100%;overflow-y:auto;font-size:15px}
/* day theme: applied between 06:00 and 18:00, or when chosen in the About panel */
body.day{--ink:#1d2a44;--soft:#4d5b78;--line:rgba(30,50,90,.16);--glass:rgba(255,255,255,.84);
  --accent:#6a55d8;--accent2:#1c8272;--warm:#b05a08;background:#bfe0f5}
body.day h1,body.day .sub,body.day .thought,body.day #gprompt{text-shadow:0 1px 14px rgba(255,255,255,.95)}
body.day .thought{color:#27355a}
body.day .note{color:#34425f}
body.day .ic{background:rgba(255,255,255,.65)}
body.day .btn,body.day .chip,body.day .inp{background:rgba(255,255,255,.66)}
body.day .btn.primary{background:linear-gradient(135deg,#8f7df0,#6fb7c9)}
body.day .btn.quiet{background:none}
body.day .chip.on,body.day .opt.on{background:rgba(106,85,216,.2)}
body.day .bar i{background:rgba(30,50,90,.1)}
body.day .ms i{color:#fff}
body.day .modal{background:rgba(170,200,225,.72)}
.buy{display:block;width:100%;text-align:start;background:none;border:0;padding:0;margin:0 0 12px;color:var(--ink);cursor:pointer}
.buy small{display:block;color:var(--soft);font-size:13px}
body.day .inp{color-scheme:light}
select.inp{cursor:pointer}
.inp[hidden]{display:none}
/* playing with the garden: the screen steps aside until the garden has been quiet for a while */
main{transition:opacity .6s ease}
body.play main{opacity:0;pointer-events:none}

function patterns() {

  const top = arr => { const c = new Map(); let bk = null; for (const x of arr) { c.set(x, (c.get(x) || 0) + 1); if (bk == null || c.get(x) > c.get(bk)) bk = x; } return bk == null ? null : [bk, c.get(bk)]; };
  const part = h => h >= 5 && h < 12 ? 0 : h >= 12 && h < 18 ? 1 : h >= 18 && h < 23 ? 2 : 3;
  const out = [], tp = top(a.map(e => part(new Date(e.t).getHours()))), td = top(a.map(e => new Date(e.t).getDay()));
  out.push(txt('patTime', txt('dayparts')[tp[0]], tp[1], a.length));
  if (td[1] >= 2 && td[1] > a.length / 7 * 1.5) out.push(txt('patDay', new Date(2024, 0, 7 + td[0]).toLocaleDateString(lang, { weekday: 'long' }), td[1]));

  if (tw && tw[1] >= 2 && txt('words')[tw[0]]) out.push(txt('patWord', txt('words')[tw[0]], tw[1]));
  let best = null;
  for (const k of Object.keys(txt('games'))) {
    const r = a.filter(e => e.skill === k && e.after != null && e.before != null);
    if (r.length < 2) continue;
    const d = r.reduce((s, e) => s + e.before - e.after, 0) / r.length;
    if (d > 0 && (!best || d > best.d)) best = { k, d };

  if (best) out.push(txt('patGame', txt('games')[best.k][0], '<bdi>−' + best.d.toFixed(1) + '</bdi>'));
  return `<div class="card"><h2>${txt('patH')}</h2><p>${txt('patP')}</p>${out.map(x => `<p class="note">${x}</p>`).join('')}</div>`;

        const X = W / 2, Y = H * .5, R0 = 44, R1 = Math.min(W, H) * .2, RO = R0 + R1 + 14, D = dayMix > .5;
        const e = x => x * x * (3 - 2 * x);
        const r = k === 0 ? ph / 4 : k === 1 ? 1 : 1 - ph / 6;
        // outer ring fills once per phase, so the length of each phase is visible
        cx.lineWidth = 3; cx.lineCap = 'round';
        cx.strokeStyle = D ? 'rgba(255,255,255,.5)' : 'rgba(255,255,255,.14)'; cx.beginPath(); cx.arc(X, Y, RO, 0, 7); cx.stroke();
        cx.strokeStyle = k === 1 ? (D ? 'rgba(200,112,16,.95)' : 'rgba(255,208,138,.9)') : (D ? 'rgba(96,74,214,.95)' : 'rgba(185,166,255,.9)');
        cx.beginPath(); cx.arc(X, Y, RO, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ph / P[k][1]); cx.stroke();
        const R = R0 + e(r) * R1;
        glow(X, Y, R * 1.9, D ? '255,255,255' : '170,160,255', D ? .5 : .28);
        glow(X, Y, R, D ? '255,255,255' : '200,230,255', D ? .97 : .8);
        cx.textAlign = 'center'; cx.textBaseline = 'middle';
        cx.fillStyle = 'rgba(11,16,32,.85)'; cx.font = '600 46px Rubik,system-ui';
        cx.fillText(Math.min(P[k][1], Math.floor(ph) + 1), X, Y + 2);
        cx.textBaseline = 'alphabetic';
        cx.fillStyle = D ? '#1d2a44' : 'rgba(233,236,248,.95)'; cx.font = '600 21px Rubik,system-ui';
        cx.fillText(P[k][0], X, Y + RO + 40);
        cx.fillStyle = D ? '#3f4d6c' : 'rgba(174,182,214,.9)'; cx.font = '14px Rubik,system-ui';
        cx.fillText(txt('countTo', P[k][1]), X, Y + RO + 62);
        for (const l of lan) {
          l.y -= dt * 16; const lx = l.x + Math.sin(t * .6 + l.p) * 10;
          if (l.y > -30) { glow(lx, l.y, 22, D ? '255,160,60' : '255,196,120', D ? .6 : .45); cx.fillStyle = D ? 'rgba(255,170,76,.97)' : 'rgba(255,214,150,.95)'; cx.beginPath(); cx.ellipse(lx, l.y, 4, 5.5, 0, 0, 7); cx.fill(); }
        }
      }
    };
  },
  wave() {
    let t0 = 0, bx = W / 2, tx = W / 2, calm = 0, ph = -1;
    const T = 90, msgs = txt('wMsgs');
    return {
      noMoon: true,
      prompt: txt('wPrompt'),
      down(x) { tx = x; }, move(x) { tx = x; },
      draw(t, dt) {
        if (!t0) t0 = t;
        const e = Math.min(1, (t - t0) / T), amp = H * .012 + H * .075 * Math.sin(Math.PI * e);
        const wy = x => H * .6 + amp * Math.sin(x * .011 + t * .8) + amp * .3 * Math.sin(x * .027 - t * 1.2);
        const n = e < .08 ? -1 : e < .38 ? 0 : e < .64 ? 1 : e < 1 ? 2 : 3;
        if (n !== ph) { ph = n; if (n >= 0) setPrompt(msgs[n]); }
        const lx = W / 2 + Math.sin(t * .12) * W * .28, D = dayMix > .5;   // the moon by night, the sun by day
        glow(lx, H * .3, D ? 100 : 70, D ? '255,236,170' : '220,225,255', D ? .6 : .22);
        cx.fillStyle = D ? '#fff7dc' : '#eef0ff'; cx.beginPath(); cx.arc(lx, H * .3, D ? 16 : 14, 0, 7); cx.fill();
        cx.strokeStyle = D ? 'rgba(196,120,24,.85)' : 'rgba(255,255,255,.5)'; cx.lineWidth = 2;
        cx.beginPath(); cx.arc(lx, H * .3, 22, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * e); cx.stroke();
        let g = cx.createLinearGradient(lx - 70, 0, lx + 70, 0);
        g.addColorStop(0, 'rgba(255,250,225,0)'); g.addColorStop(.5, D ? 'rgba(255,250,225,.2)' : 'rgba(220,230,255,.10)'); g.addColorStop(1, 'rgba(255,250,225,0)');
        cx.fillStyle = g; cx.fillRect(lx - 70, 0, 140, H);
        g = cx.createLinearGradient(0, H * .5, 0, H);
        g.addColorStop(0, D ? 'rgba(64,150,200,.94)' : 'rgba(52,74,128,.92)'); g.addColorStop(1, D ? '#1c5a86' : '#090d1c');
        cx.fillStyle = g; cx.beginPath(); cx.moveTo(0, H);
        for (let x = 0; x <= W + 8; x += 8) cx.lineTo(x, wy(x));
        cx.lineTo(W, H); cx.fill();
        g = cx.createLinearGradient(lx - 60, 0, lx + 60, 0);
        g.addColorStop(0, 'rgba(230,236,255,0)'); g.addColorStop(.5, D ? 'rgba(255,250,220,.3)' : 'rgba(230,236,255,.14)'); g.addColorStop(1, 'rgba(230,236,255,0)');
        cx.fillStyle = g; cx.fillRect(lx - 60, H * .6 + amp, 120, H);
        bx += (clamp(tx, 24, W - 24) - bx) * Math.min(1, dt * 2.2);
        const by = wy(bx), sl = (wy(bx + 6) - wy(bx - 6)) / 12;
        calm = clamp(calm + (Math.abs(bx - lx) < 60 ? dt : -dt) * .6, 0, 1);
        glow(bx, by - 8, 56, '255,240,200', .4 * calm);
        cx.save(); cx.translate(bx, by); cx.rotate(Math.atan(sl));
        cx.fillStyle = D ? '#7a4a2c' : '#e8e2d0'; cx.beginPath(); cx.moveTo(-17, -5); cx.quadraticCurveTo(0, 9, 17, -5); cx.closePath(); cx.fill();
        cx.strokeStyle = D ? '#7a4a2c' : '#e8e2d0'; cx.lineWidth = 1.5; cx.beginPath(); cx.moveTo(0, -5); cx.lineTo(0, -28); cx.stroke();
        cx.fillStyle = D ? '#fff' : 'rgba(255,255,255,.88)'; cx.beginPath(); cx.moveTo(2, -27); cx.lineTo(2, -8); cx.lineTo(15, -9); cx.closePath(); cx.fill();
        cx.restore();
      }
    };
  },
  name() {
    let c = null, drag = false, lx = 0, ly = 0, vx = 0, vy = 0, n = 0;
    const words = txt('words');
    const ui = () => { const u = $('#gui'); if (u) u.innerHTML = c ? '' : words.map((w, i) => `<button class="chip" data-act="gword" data-arg="${i}">${w}</button>`).join(''); };
    return {
      prompt: txt('nPrompt'), init: ui,
      word(i) { const w = words[+i]; c = { x: W / 2, y: H * .48, w, a: 0, free: false }; ui(); setPrompt(txt('nNotice', w)); },
      down(x, y) { if (c && !c.free) { drag = true; lx = x; ly = y; vx = vy = 0; } },
      move(x, y) { if (drag) { c.x += x - lx; c.y += y - ly; vx = vx * .6 + (x - lx) * .4; vy = vy * .6 + (y - ly) * .4; lx = x; ly = y; } },
      up() {
        if (!drag) return; drag = false; c.free = true;
        c.vx = clamp(vx * 20, -120, 120); if (Math.abs(c.vx) < 10) c.vx = 18;
        c.vy = Math.min(clamp(vy * 20, -120, 120), 0) - 25;
      },
      draw(t, dt) {
        if (!c) return;
        if (c.free) {
          c.x += c.vx * dt; c.y += c.vy * dt; c.a -= dt / 5;
          if (c.a <= 0) { c = null; n++; ui(); setPrompt(txt(n < 3 ? 'nMore' : 'nEnd')); return; }
        } else c.a = Math.min(1, c.a + dt * 1.5);
        const y = c.y + (drag ? 0 : Math.sin(t) * 4 * MOV);
        const D = dayMix > .5;
        cx.fillStyle = D ? `rgba(255,255,255,${.62 * c.a})` : `rgba(225,230,250,${.17 * c.a})`;
        for (const [ox, oy, r] of [[-40, 6, 28], [-14, -12, 36], [20, -8, 32], [46, 8, 26], [4, 14, 34]]) {
          cx.beginPath(); cx.arc(c.x + ox, y + oy, r, 0, 7); cx.fill();
        }
        cx.fillStyle = D ? `rgba(29,42,68,${c.a})` : `rgba(240,243,255,${c.a})`; cx.font = '600 17px Rubik,system-ui'; cx.textAlign = 'center';
        cx.fillText(c.w, c.x, y + 6);
      }
    };
  },
  ground() {
    const st = txt('gStages');
    let si = -1, wait = .3; const fl = [], up = [];
    const next = () => {
      si++;
      if (si >= st.length) return setPrompt(txt('gEnd'));
      const [n, w] = st[si];
      setPrompt(si < 4 ? txt('gPrompt', n, w) : txt('gLast', w));
      for (let i = 0; i < n; i++) fl.push({ x: W * (.15 + .7 * Math.random()), y: H * (.32 + .34 * Math.random()), p: Math.random() * 7 });
    };
    return {
      prompt: '',
      down(x, y) {
        let b = -1, bd = 60 * 60;
        fl.forEach((f, i) => { const d = (f.x - x) ** 2 + (f.y - y) ** 2; if (d < bd) { bd = d; b = i; } });
        if (b < 0) return;
        const f = fl.splice(b, 1)[0]; up.push({ x: f.x, y: f.y, ty: H * (.1 + .14 * Math.random()) });
        if (!fl.length) wait = .9;
      },
      draw(t, dt) {
        if (!fl.length && si < st.length && (wait -= dt) <= 0) next();
        for (const f of fl) {
          f.x = clamp(f.x + Math.sin(t * .7 + f.p) * 10 * dt, 20, W - 20); f.y += Math.cos(t * .5 + f.p * 2) * 8 * dt;
          const D = dayMix > .5;   // by day the fireflies glow amber so they show against the sky
          glow(f.x, f.y, 26, D ? '255,176,30' : '225,255,170', (D ? .65 : .45) + .2 * Math.sin(t * 2 + f.p));
          cx.fillStyle = D ? '#fff6c8' : '#f4ffd0'; cx.beginPath(); cx.arc(f.x, f.y, D ? 4 : 3, 0, 7); cx.fill();
        }
        for (const s of up) {
          s.y += (s.ty - s.y) * Math.min(1, dt * 1.2);
          glow(s.x, s.y, dayMix > .5 ? 16 : 12, '255,255,255', dayMix > .5 ? .9 : .5);
          cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(s.x, s.y, dayMix > .5 ? 2.6 : 1.8, 0, 7); cx.fill();
        }
      }
    };
  }
};
let pdown = false;
cv.addEventListener('pointerdown', e => { pdown = true; if (G && G.down) G.down(e.clientX, e.clientY); });
cv.addEventListener('pointermove', e => { if (pdown && G && G.move) G.move(e.clientX, e.clientY); });
const pup = () => { if (pdown && G && G.up) G.up(); pdown = false; hold = null; };
addEventListener('pointerup', pup); addEventListener('pointercancel', pup);
/* garden touches: anywhere that is not a button, a card or a game */
addEventListener('pointerdown', e => {
  if (G || !e.target.closest || e.target.closest('button,input,select,textarea,a,label,.card,.modal,header')) return;
  hold = { x: e.clientX, y: e.clientY, d: 0 };
  if (!hero) playTouch();
  touchAt(e.clientX, e.clientY);
});
$('#playback').addEventListener('click', () => { hold = null; endPlay(); });
addEventListener('pointermove', e => {
  if (!hold) return;
  if (G) { hold = null; return; }
  const x = e.clientX, y = e.clientY, dx = x - hold.x, dir = dx < 0 ? -1 : 1;
  hold.d += Math.hypot(dx, y - hold.y); hold.x = x; hold.y = y;
  if (hold.d < 16) return;
  hold.d = 0;
  if (document.body.classList.contains('play')) playTouch();
  if (!RM) spawn({ k: 'dot', x, y, vy: -8, r: 5, life: 1.2, rgb: '200,215,255', a: .5 });
  for (const p of plantList) if (segDist(x, y, p.hx, p.hy, p.x, p.y) < 16) touchPlant(p, dir, true);
  if (inTree(x, y)) touchTree(dir, true);
});

let lastT = 0;
function frame(ms) {
  requestAnimationFrame(frame);   // first, so one bad frame can never stop the garden
  if (!W || !H) return;           // window not laid out yet
  const t = ms / 1000, dt = Math.min(.05, t - lastT || 0); lastT = t;
  drawSky(t, dt);
  if (G) { fx.length = 0; G.draw(t, dt); }
  else if (hero) { plantList = []; tree.box = null; drawHills(); drawHero(t); drawFlies(t, dt); drawFx(dt); }
  else {
    drawHills(); drawTree(t, dt); drawPlants(t, dt); drawFlies(t, dt); drawFx(dt);
    if ((nextStar -= dt) <= 0) { shoot(); nextStar = R(25, 70); }
  }
}
requestAnimationFrame(frame);

/* ---------- generated ambient music ---------- */
let AC = null, master = null, bus = null, padF = null, ci = 0;
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function startAudio() {
  if (AC || S.muted) return;
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  try { AC = new C(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  master.gain.linearRampToValueAtTime(.8, AC.currentTime + 4);
  bus = AC.createGain(); bus.connect(master);
  const dl = AC.createDelay(1), fb = AC.createGain(), lp = AC.createBiquadFilter();
  dl.delayTime.value = .47; fb.gain.value = .42; lp.type = 'lowpass'; lp.frequency.value = 1800;
  bus.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(master);
  padF = AC.createBiquadFilter(); padF.type = 'lowpass'; padF.frequency.value = 900; padF.connect(bus);
  // wind
  const buf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const ns = AC.createBufferSource(), bp = AC.createBiquadFilter(), wg = AC.createGain();
  ns.buffer = buf; ns.loop = true; bp.type = 'bandpass'; bp.frequency.value = 480; bp.Q.value = .6; wg.gain.value = .018;
  const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = .07; lg.gain.value = .011;
  lfo.connect(lg); lg.connect(wg.gain); ns.connect(bp); bp.connect(wg); wg.connect(master); ns.start(); lfo.start();
  pad(); setTimeout(chime, 5000);
}
const CHORDS = [[48, 55, 64, 71, 74], [45, 52, 60, 67, 71], [41, 53, 57, 64, 69], [43, 50, 59, 62, 69]];
function pad() {
  if (AC.state !== 'running') return setTimeout(pad, 1000);
  const t = AC.currentTime, c = CHORDS[ci++ % CHORDS.length];
  c.forEach((m, i) => [0, 1].forEach(k => {
    const o = AC.createOscillator(), g = AC.createGain(), v = .05 / (1 + i * .25);
    o.type = k ? 'triangle' : 'sine'; o.frequency.value = hz(m); o.detune.value = k ? 7 : -5;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 5);
    g.gain.setValueAtTime(v, t + 10); g.gain.linearRampToValueAtTime(0, t + 18);
    o.connect(g); g.connect(padF); o.start(t); o.stop(t + 18.5);
  }));
  setTimeout(pad, 12000);
}
const BELLS = [72, 74, 76, 79, 81, 84, 86];
function chime() {
  if (AC.state === 'running') {
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = hz(BELLS[Math.floor(Math.random() * BELLS.length)]);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.05, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + 4);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + 4.2);
  }
  setTimeout(chime, 4000 + Math.random() * 6000);
}
function soundUI() { $('#bSound').classList.toggle('off', !!S.muted); }
$('#bSound').onclick = () => {
  S.muted = !S.muted; save(); soundUI();
  if (S.muted) {
    if (!AC) return;
    master.gain.cancelScheduledValues(AC.currentTime); master.gain.setTargetAtTime(0, AC.currentTime, .15);
    setTimeout(() => { if (S.muted) AC.suspend(); }, 700);
  } else if (!AC) startAudio();
  else { AC.resume(); master.gain.cancelScheduledValues(AC.currentTime); master.gain.setTargetAtTime(.8, AC.currentTime, .5); }
};
addEventListener('pointerdown', startAudio);
document.addEventListener('visibilitychange', () => {
  if (!AC) return;
  if (document.hidden) AC.suspend(); else if (!S.muted) AC.resume();
});

/* installable app: offline copy and storage the browser should not clear (only when served over http/https) */
if (/^https?:$/.test(location.protocol)) {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
setLang(S.lang || (/^he/i.test(navigator.language || '') ? 'he' : 'en'));
soundUI(); S.profile ? home() : onboard();
